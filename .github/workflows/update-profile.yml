name: Atualizar perfil

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.json, scripts/**]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - name: Coletar commits e gerar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/update.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          git diff --cached --quiet || git commit -m "chore: atualiza perfil"
          git push
